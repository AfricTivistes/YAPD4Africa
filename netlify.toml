[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Hashed assets generated by Astro never change: cache them forever.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Old file locations from the previous (Lovable) site.
[[redirects]]
  from = "/lovable-uploads/Reports/YAPD4Africa%205years.pdf"
  to = "/reports/yapd4africa-5-years-social-impact-report.pdf"
  status = 301

[[redirects]]
  from = "/lovable-uploads/Reports/Gwaraji%20Ward%20Report_compressed.pdf"
  to = "/reports/gwaraji-ward-needs-assessment-report.pdf"
  status = 301

[[redirects]]
  from = "/lovable-uploads/Reports/JOGA-%201%20REPORT%20.pdf"
  to = "/reports/joga-village-community-intervention-report.pdf"
  status = 301

[[redirects]]
  from = "/lovable-uploads/logoyapd_transparent.png"
  to = "/images/logo.png"
  status = 301

[[redirects]]
  from = "/favicon.ico"
  to = "/images/favicon-48.png"
  status = 301
